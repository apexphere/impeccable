<!-- @dsCard group="Components" -->
<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <title>Buttons</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { background: var(--ks-lacquer); color: var(--ks-text);
           font-family: var(--ks-font); padding: 40px; }
    h2 { font-family: var(--ks-font-display); font-weight: 300;
         font-size: 2.4rem; margin: 0 0 4px; color: var(--ks-champagne); }
    .lead { color: var(--ks-text-muted); margin: 0 0 32px; max-width: 60ch; }
    .stage { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }

    /* Faithful copy of .btn rules from site/styles/main.css. Legacy --color-*
       tokens resolve to brand values via ../tokens.css. */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: var(--spacing-xs); padding: 1rem 2rem; font-family: var(--font-body);
      font-size: 0.9375rem; font-weight: 600; letter-spacing: 0.03em;
      border: none; cursor: pointer; text-decoration: none;
      transition: all var(--duration-base) var(--ease-out);
      position: relative; overflow: hidden;
    }
    .btn-primary { background: var(--color-ink); color: var(--color-paper); }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0; background: var(--color-accent);
      transform: translateY(100%);
      transition: transform var(--duration-base) var(--ease-out); z-index: 0;
    }
    .btn-primary:hover::before { transform: translateY(0); }
    .btn-primary:hover { color: var(--color-paper); }
    .btn-primary span { position: relative; z-index: 1; }
    .btn-secondary {
      background: transparent; color: var(--color-ink);
      border: 1px solid var(--color-ink);
    }
    .btn-secondary:hover { background: var(--color-ink); color: var(--color-paper); }
    .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
    .btn-primary:focus-visible {
      outline-color: var(--color-paper); box-shadow: 0 0 0 4px var(--color-accent);
    }
  </style>
</head>
<body>
  <h2>Buttons</h2>
  <p class="lead">Two variants. Primary fills with ink and wipes gold on hover;
    secondary is an outline that inverts. Hover the swatches to see the
    transition.</p>

  <div class="stage">
    <a class="btn btn-primary" href="#"><span>Primary action</span></a>
    <a class="btn btn-secondary" href="#">Secondary action</a>
  </div>
  <script src="../card.js"></script>
</body>
</html>
