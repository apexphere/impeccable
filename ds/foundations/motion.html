<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <title>Motion — easing & duration</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { background: var(--ks-lacquer); color: var(--ks-text);
           font-family: var(--ks-font); padding: 40px; }
    h2 { font-family: var(--ks-font-display); font-weight: 300;
         font-size: 2.4rem; margin: 0 0 4px; color: var(--ks-champagne); }
    .lead { color: var(--ks-text-muted); margin: 0 0 28px; max-width: 60ch; }
    .row { display: grid; grid-template-columns: 150px 1fr;
           gap: 20px; align-items: center; padding: 10px 0;
           border-top: 1px solid var(--ks-rule); }
    .name { font-family: var(--ks-mono); font-size: 12px;
            color: var(--ks-text-faint); }
    .track { height: 22px; background: var(--ks-graphite); border-radius: 3px;
             position: relative; overflow: hidden; }
    .dot { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
           border-radius: 50%; background: var(--ks-kinpaku);
           animation: slide 2.4s infinite; }
    .e-out      { animation-timing-function: var(--ease-out); }
    .e-in-out   { animation-timing-function: var(--ease-in-out); }
    .e-out-quint{ animation-timing-function: var(--ease-out-quint); }
    .e-ks       { animation-timing-function: var(--ks-ease); }
    @keyframes slide {
      0%, 12% { left: 3px; }
      50%, 62% { left: calc(100% - 19px); }
      100% { left: 3px; }
    }
    .durations { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .pill { font-family: var(--ks-mono); font-size: 11px;
            border: 1px solid var(--ks-rule); border-radius: 999px;
            padding: 6px 12px; color: var(--ks-text-muted); }
  </style>
</head>
<body>
  <h2>Motion</h2>
  <p class="lead">Four eases, each tuned for a different gesture. The brand ease
    drives most UI transitions; the quint ease is for showy entrances.</p>

  <div class="row"><span class="name">ease-out</span><div class="track"><div class="dot e-out"></div></div></div>
  <div class="row"><span class="name">ease-in-out</span><div class="track"><div class="dot e-in-out"></div></div></div>
  <div class="row"><span class="name">ease-out-quint</span><div class="track"><div class="dot e-out-quint"></div></div></div>
  <div class="row"><span class="name">ks-ease (brand)</span><div class="track"><div class="dot e-ks"></div></div></div>

  <div class="durations">
    <span class="pill">fast 0.15s</span>
    <span class="pill">base 0.3s</span>
    <span class="pill">slow 0.6s</span>
    <span class="pill">slower 0.8s</span>
    <span class="pill">slowest 1.2s</span>
  </div>
  <script src="../card.js"></script>
</body>
</html>
