<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <title>Spacing scale</title>
  <link rel="stylesheet" href="../tokens.css">
  <style>
    body { background: var(--ks-lacquer); color: var(--ks-text);
           font-family: var(--ks-font); padding: 40px; }
    h2 { font-family: var(--ks-font-display); font-weight: 300;
         font-size: 2.4rem; margin: 0 0 4px; color: var(--ks-champagne); }
    .lead { color: var(--ks-text-muted); margin: 0 0 28px; max-width: 60ch; }
    .row { display: grid; grid-template-columns: 90px 70px 1fr;
           gap: 16px; align-items: center; padding: 8px 0; }
    .name { font-family: var(--ks-mono); font-size: 12px;
            letter-spacing: 0.1em; color: var(--ks-text-faint); }
    .val { font-family: var(--ks-mono); font-size: 12px;
           color: var(--ks-text-muted); }
    .bar { height: 18px; background: var(--ks-kinpaku); border-radius: 2px; }
  </style>
</head>
<body>
  <h2>Spacing</h2>
  <p class="lead">An 8px-based scale. Steps jump from tight component padding
    (xs) up to section rhythm (3xl).</p>

  <div class="row"><span class="name">xs</span><span class="val">8px</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="name">sm</span><span class="val">16px</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="name">md</span><span class="val">24px</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="name">lg</span><span class="val">32px</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="name">xl</span><span class="val">48px</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="name">2xl</span><span class="val">80px</span><div class="bar" style="width:80px"></div></div>
  <div class="row"><span class="name">3xl</span><span class="val">120px</span><div class="bar" style="width:120px"></div></div>
  <script src="../card.js"></script>
</body>
</html>
